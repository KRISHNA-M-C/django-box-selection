<!DOCTYPE html>
<html>
<head>
    <title>Box Recommendation</title>
</head>
<body>

    <h1>Box Recommendation</h1>

    <form method="post">
        {% csrf_token %}

        <label>Length:</label>
        <input type="number" step="0.01" name="length" required>
        <br><br>

        <label>Width:</label>
        <input type="number" step="0.01" name="width" required>
        <br><br>

        <label>Height:</label>
        <input type="number" step="0.01" name="height" required>
        <br><br>

        <label>Weight:</label>
        <input type="number" step="0.01" name="weight" required>
        <br><br>

        <button type="submit">Find Suitable Box</button>
    </form>

    {% if result %}
        <h2>Recommendation</h2>
        <p>{{ result }}</p>
    {% endif %}

</body>
</html>
